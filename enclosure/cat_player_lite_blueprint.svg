<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17263a; }
      .title { font-size: 34px; font-weight: 700; }
      .label { font-size: 20px; }
      .small { font-size: 16px; }
      .outline { fill: #fff8fb; stroke: #17263a; stroke-width: 4; }
      .feature { fill: none; stroke: #1769d2; stroke-width: 3; }
      .callout { fill: none; stroke: #647084; stroke-width: 2; }
      .keep { fill: #e5f5ec; stroke: #28915c; stroke-width: 2; }
      .cut { fill: #fff0f2; stroke: #c53d55; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#fbfcfe"/>
  <text x="55" y="55" class="title">Cat Player Lite — under-$30 revision</text>
  <text x="55" y="86" class="label">116 mm wide · about 108 mm tall · 24 mm deep · USB powered</text>

  <g transform="translate(360 410)">
    <path class="outline" d="M 0 210 C -190 210 -290 150 -290 20 C -290 -85 -235 -155 -165 -175 L -250 -110 L -210 -320 L -90 -165 C -55 -185 55 -185 90 -165 L 210 -320 L 250 -110 L 165 -175 C 235 -155 290 -85 290 20 C 290 150 190 210 0 210 Z"/>

    <rect x="-58" y="-95" width="116" height="65" rx="8" class="feature"/>
    <text x="0" y="-68" text-anchor="middle" class="small">0.96-inch OLED</text>
    <text x="0" y="-47" text-anchor="middle" class="small">track + volume</text>

    <circle cx="-175" cy="-15" r="26" class="feature"/>
    <text x="-175" y="-9" text-anchor="middle" class="small">PREV</text>
    <circle cx="175" cy="-15" r="26" class="feature"/>
    <text x="175" y="-9" text-anchor="middle" class="small">NEXT</text>

    <circle cx="185" cy="105" r="19" class="feature"/>
    <path d="M 185 86 L 185 124 M 166 105 L 204 105" class="feature"/>
    <text x="214" y="112" class="small">volume / press to pause</text>

    <g class="feature">
      <circle cx="-48" cy="138" r="6"/><circle cx="-24" cy="138" r="6"/><circle cx="0" cy="138" r="6"/><circle cx="24" cy="138" r="6"/><circle cx="48" cy="138" r="6"/>
      <circle cx="-48" cy="163" r="6"/><circle cx="-24" cy="163" r="6"/><circle cx="0" cy="163" r="6"/><circle cx="24" cy="163" r="6"/><circle cx="48" cy="163" r="6"/>
    </g>
    <text x="0" y="192" text-anchor="middle" class="small">speaker</text>
  </g>

  <g transform="translate(790 155)">
    <rect x="0" y="0" width="340" height="260" rx="18" class="keep"/>
    <text x="22" y="38" class="label" style="font-weight:700">Kept in the $25.64 build</text>
    <text x="28" y="75" class="label">• cat-shaped printed case</text>
    <text x="28" y="108" class="label">• OLED track/volume display</text>
    <text x="28" y="141" class="label">• previous and next buttons</text>
    <text x="28" y="174" class="label">• volume knob + play/pause</text>
    <text x="28" y="207" class="label">• speaker + removable microSD</text>
    <text x="28" y="240" class="label">• Wi-Fi/BLE-capable controller</text>

    <rect x="0" y="292" width="340" height="250" rx="18" class="cut"/>
    <text x="22" y="330" class="label" style="font-weight:700">Moved to a later revision</text>
    <text x="28" y="367" class="label">• camera and microphone</text>
    <text x="28" y="400" class="label">• headphones and stereo codec</text>
    <text x="28" y="433" class="label">• battery and charger</text>
    <text x="28" y="466" class="label">• color OLED</text>
    <text x="28" y="499" class="label">• custom PCB / cyberdeck computer</text>
    <text x="28" y="530" class="small">First build uses perfboard and USB power.</text>
  </g>

  <text x="55" y="760" class="small">Original simplified enclosure based on the supplied sketch. Measure real modules before printing.</text>
</svg>
